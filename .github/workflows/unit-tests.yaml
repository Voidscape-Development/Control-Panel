name: Unit Tests
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
    branches: [master, main]
  pull_request:
    paths-ignore:
      - '**.md'
    branches: [master, main]
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true
jobs:
  model-tests:
    name: Model Tests 🧪
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies 🛍️
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev ninja-build
      - name: Build Tests 🧱
        run: |
          cmake -S tests -B build_tests -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build_tests
      - name: Run Tests 🧪
        run: ctest --test-dir build_tests --output-on-failure
